name: Build AutoSchematicBuilder

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'AutoSchematicBuilder-source.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract project
        run: unzip AutoSchematicBuilder-source.zip -d extracted

      - name: Build mod
        working-directory: extracted/AutoSchematicBuilder
        run: gradle build

      - name: Save mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoSchematicBuilder-JAR
          path: extracted/AutoSchematicBuilder/build/libs/*.jar
